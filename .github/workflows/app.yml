# 11단계 앱(app/)의 린트·형식 검사·시험·빌드와 키 검사(TASK-015, REQ-135).
# 데이터베이스가 있어야 하는 서버 시험(TASK-018: 요청 키·연결 층·운영 기록)은 이 작업 안의 PostgreSQL에
# db/migrations/의 마이그레이션 전부를 적용한 뒤 돌린다. REQUIRE_DATABASE_TESTS=1이라 연결이 없으면 건너뛰지 않고 실패한다.
# 검사 작업에는 비밀 값을 하나도 넘기지 않는다. 시험은 키 없이 지나야 한다(11단계 계약).
# 시험용 PostgreSQL은 이 작업 안에서만 돌고 비밀번호 없이 받는다(trust, 시험용이며 비밀 값이 아님).
name: app

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # db.yml과 같은 이미지(16.15, 2026-11-05, digest 고정)
        image: postgres:16.15-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      WRANGLER_SEND_METRICS: "false"
      PG: host=127.0.0.1 port=5432 user=postgres
      # 서버 시험이 쓰는 시험용 데이터베이스(비밀 값 아님). 없으면 시험이 실패한다(건너뛰지 않음).
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/app_test
      REQUIRE_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 키 검사기 자체 시험
        run: node ../tools/check-no-keys.mjs --self-test

      - name: 저장소 키 검사(git이 추적하는 파일 전부)
        run: node ../tools/check-no-keys.mjs --repo

      - name: 설치
        run: |
          mkdir -p ci-logs
          npm ci --no-audit --no-fund 2>&1 | tee ci-logs/install.log

      - name: 린트·형식(Biome)
        run: npm run lint 2>&1 | tee ci-logs/lint.log

      - name: 합성 화면 자료 생성·계약(브라우저 실행 없음)
        run: |
          node --test ../research/screen-checks-2026-11/kakao-channel-fixture.test.mjs ../research/screen-checks-2026-11/kakao-consultation-fixture.test.mjs ../research/screen-checks-2026-11/kakao-channel-source.test.mjs ../research/screen-checks-2026-11/owner-tasks-source.test.mjs ../research/screen-checks-2026-11/owner-tasks-fixture.test.mjs ../research/screen-checks-2026-11/operating-rules-fixture.test.mjs ../research/screen-checks-2026-11/operating-rules-source.test.mjs ../research/screen-checks-2026-11/operating-rules-history-fixture.test.mjs ../research/screen-checks-2026-11/payment-destination-fixture.test.mjs ../research/screen-checks-2026-11/booking-link-fixture.test.mjs 2>&1 | tee ci-logs/channel-fixture.log
          node ../research/screen-checks-2026-11/build-kakao-channel.mjs .. "$RUNNER_TEMP/siljang-kakao-channel-fixture" 2>&1 | tee ci-logs/kakao-channel-fixture.log
          node ../research/screen-checks-2026-11/build-owner-tasks.mjs .. "$RUNNER_TEMP/siljang-owner-tasks-fixture" 2>&1 | tee ci-logs/owner-tasks-fixture.log
          node ../research/screen-checks-2026-11/build-operating-rules.mjs .. "$RUNNER_TEMP/siljang-operating-rules-fixture" 2>&1 | tee ci-logs/operating-rules-fixture.log
          node ../research/screen-checks-2026-11/build-operating-rules-history.mjs .. "$RUNNER_TEMP/siljang-rules-history-fixture" 2>&1 | tee ci-logs/rules-history-fixture.log
          node ../research/screen-checks-2026-11/build-payment-destination.mjs .. "$RUNNER_TEMP/siljang-payment-fixture" 2>&1 | tee ci-logs/payment-fixture.log
          node ../research/screen-checks-2026-11/build-booking-link.mjs .. "$RUNNER_TEMP/siljang-booking-link-fixture" 2>&1 | tee ci-logs/booking-link-fixture.log
          node ../research/screen-checks-2026-11/build-kakao-consultation.mjs .. "$RUNNER_TEMP/siljang-consultation-fixture" 2>&1 | tee ci-logs/consultation-fixture.log
          node ../research/screen-checks-2026-11/build-kakao-order-request.mjs .. "$RUNNER_TEMP/siljang-order-request-fixture" 2>&1 | tee ci-logs/order-request-fixture.log

      - name: 타입 검사(TypeScript)
        run: npm run typecheck 2>&1 | tee ci-logs/typecheck.log

      - name: 시험용 데이터베이스(마이그레이션 전부)
        run: |
          psql -X -q -v ON_ERROR_STOP=1 -c "CREATE DATABASE app_test TEMPLATE template0" "$PG dbname=postgres"
          bash ../tools/db-migrate.sh "$PG dbname=app_test" 2>&1 | tee ci-logs/migrate.log

      - name: 시험(Vitest, 데이터베이스 시험 포함)
        run: npm test 2>&1 | tee ci-logs/test.log

      - name: 스테이징 설정 도구 시험(비밀 값 없이)
        run: node --test ../tools/test/staging-runtime.test.mjs ../tools/test/staging-owner-login.test.mjs ../tools/test/staging-monitor.test.mjs ../tools/test/staging-job-policy.test.mjs ../research/webp-orientation-2026-11/active-version.test.mjs 2>&1 | tee ci-logs/staging-runtime.log

      - name: 학원컴 평가의 키 비전달·실패 정리 시험(모의)
        run: python3 -I ../research/ai-eval-native-2026-11/test_native_auth.py 2>&1 | tee ci-logs/native-auth.log

      - name: 빌드(웹 Vite, 서버 wrangler --dry-run)
        run: npm run build 2>&1 | tee ci-logs/build.log

      - name: 로그 키 검사(설치·린트·타입 검사·마이그레이션·시험·빌드 로그)
        if: ${{ !cancelled() }}
        run: node ../tools/check-no-keys.mjs ci-logs/*.log

  native-auth-windows:
    name: Windows PowerShell 평가 인증(모의)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: 공개 평가 코드 설치/생성
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          node ../research/ai-eval-native-2026-11/bundle.mjs "$env:RUNNER_TEMP/siljang-auth-eval.mjs"
      - name: Windows PowerShell의 인증 분기·결과 반환/거절·정리(외부 모델 요청 없음)
        shell: pwsh
        env:
          SILJANG_NATIVE_TEST_BUNDLE: ${{ runner.temp }}/siljang-auth-eval.mjs
        run: python -I ../research/ai-eval-native-2026-11/test_native_driver.py

      - name: Windows 합성 화면 자료 생성·계약(브라우저 실행 없음)
        shell: pwsh
        run: |
          node --test ../research/screen-checks-2026-11/kakao-channel-fixture.test.mjs ../research/screen-checks-2026-11/kakao-consultation-fixture.test.mjs ../research/screen-checks-2026-11/kakao-channel-source.test.mjs ../research/screen-checks-2026-11/owner-tasks-source.test.mjs ../research/screen-checks-2026-11/owner-tasks-fixture.test.mjs ../research/screen-checks-2026-11/operating-rules-fixture.test.mjs ../research/screen-checks-2026-11/operating-rules-source.test.mjs ../research/screen-checks-2026-11/operating-rules-history-fixture.test.mjs ../research/screen-checks-2026-11/payment-destination-fixture.test.mjs ../research/screen-checks-2026-11/booking-link-fixture.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../research/screen-checks-2026-11/build-kakao-channel.mjs .. "$env:RUNNER_TEMP/siljang-kakao-channel-fixture"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../research/screen-checks-2026-11/build-owner-tasks.mjs .. "$env:RUNNER_TEMP/siljang-owner-tasks-fixture"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../research/screen-checks-2026-11/build-operating-rules.mjs .. "$env:RUNNER_TEMP/siljang-operating-rules-fixture"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../research/screen-checks-2026-11/build-operating-rules-history.mjs .. "$env:RUNNER_TEMP/siljang-rules-history-fixture"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../research/screen-checks-2026-11/build-payment-destination.mjs .. "$env:RUNNER_TEMP/siljang-payment-fixture"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../research/screen-checks-2026-11/build-booking-link.mjs .. "$env:RUNNER_TEMP/siljang-booking-link-fixture"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../research/screen-checks-2026-11/build-kakao-consultation.mjs .. "$env:RUNNER_TEMP/siljang-consultation-fixture"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../research/screen-checks-2026-11/build-kakao-order-request.mjs .. "$env:RUNNER_TEMP/siljang-order-request-fixture"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  deploy-staging:
    name: 스테이징 배포
    needs: [check, native-auth-windows]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SILJANG_STAGING_DOMAIN != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      url: https://${{ vars.SILJANG_STAGING_DOMAIN }}
    env:
      SILJANG_STAGING_DOMAIN: ${{ vars.SILJANG_STAGING_DOMAIN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 설치와 웹 빌드
        run: |
          npm ci --no-audit --no-fund
          npm run build -w web

      - name: 스테이징 큐와 비밀 값 준비
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node ../tools/staging-runtime.mjs prepare

      - name: 스테이징 Worker 배포
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ ! "$SILJANG_STAGING_DOMAIN" =~ ^staging\.[a-z0-9-]+(\.[a-z0-9-]+)+$ ]]; then
            echo 'SILJANG_STAGING_DOMAIN에 스테이징 주소를 넣어 주세요.' >&2
            exit 1
          fi
          : "${CLOUDFLARE_ACCOUNT_ID:?staging 환경의 CLOUDFLARE_ACCOUNT_ID가 필요합니다.}"
          : "${CLOUDFLARE_API_TOKEN:?staging 환경의 CLOUDFLARE_API_TOKEN이 필요합니다.}"
          npx --no-install wrangler deploy --config server/wrangler.storage-batches.jsonc --env staging \
            --strict --tag "$GITHUB_SHA"
          npx --no-install wrangler deploy --config server/wrangler.jsonc --env staging \
            --domain "$SILJANG_STAGING_DOMAIN" --strict --keep-vars --tag "$GITHUB_SHA"

      - name: 공개 주소 확인
        run: |
          curl --fail-with-body --silent --show-error --max-time 10 --retry 4 --retry-all-errors \
            "https://$SILJANG_STAGING_DOMAIN/api/healthz" | jq -e '.status == "ok"'

      - name: 최신 배포 태그와 공개 상태 대조
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node ../tools/staging-runtime.mjs verify

      - name: 스테이징 데이터베이스 조회 확인
        run: |
          # 임의의 쿠키는 실제 세션을 찾는 SELECT를 거쳐 401을 돌려받아야 한다.
          synthetic=$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          status=$(curl --silent --show-error --max-time 15 --output "$body" --write-out '%{http_code}' \
            --header "Cookie: siljang_operator=$synthetic" "https://$SILJANG_STAGING_DOMAIN/api/operator/me")
          if [[ "$status" != 401 ]] || ! jq -e '.code == "unauthenticated"' "$body" > /dev/null; then
            printf '스테이징 DB 조회 확인 실패 (HTTP %s)\n' "$status" >&2
            exit 1
          fi
          printf '스테이징 DB 조회 확인: HTTP 401 unauthenticated\n'

      - name: 스테이징 사장님 로그인 시작 확인
        env:
          KAKAO_OWNER_LOGIN_SCOPES: ${{ vars.KAKAO_OWNER_LOGIN_SCOPES }}
        run: node ../tools/staging-owner-login.mjs
