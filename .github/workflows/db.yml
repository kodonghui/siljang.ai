# 05 스키마(db/)를 PostgreSQL 16과 17에서 검사한다(TASK-017·174, 04 공통 규칙 G3).
# 1) db/migrations/의 마이그레이션 전부를 빈 데이터베이스에 파일 이름 차례로 하나씩 적용(파일마다 한 트랜잭션, 실패하면 멈춤)
# 2) 그 데이터베이스에서 05 규칙 테스트(research/cake-erd-2026-11/rule_tests.sql)
# 3) 05 검사 전부(check_erd.py: 정적 검사 S1~S9, schema.sql과 마이그레이션의 카탈로그 비교 D1~D3,
#    규칙 테스트 D4, 두 세션 동시 쓰기 D5, ERD Editor 파일 E1)
# 시험용 PostgreSQL은 이 작업 안에서만 돌고 비밀번호 없이 받는다(trust, 시험용이며 비밀 값이 아님).
# 이 작업에는 비밀 값을 하나도 넘기지 않는다.
name: db

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: "16.15"
            image: postgres:16.15-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
          - postgres: "17.11"
            image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    name: PostgreSQL ${{ matrix.postgres }}
    services:
      postgres:
        # 16은 기존 앱 시험과 같은 판이고, 17은 Supabase와 같은 주 버전이다.
        image: ${{ matrix.image }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PG: host=127.0.0.1 port=5432 user=postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: app/.nvmrc

      - name: 판 확인(Python·psql·서버)
        run: |
          mkdir -p ci-logs
          { python3 --version; psql --version; psql -X -A -t -c "SELECT version()" "$PG dbname=postgres"; } 2>&1 | tee ci-logs/versions.log

      - name: 마이그레이션 전부를 파일 이름 차례로(파일마다 한 트랜잭션, 실패하면 멈춤)
        run: |
          psql -X -q -v ON_ERROR_STOP=1 -c "CREATE DATABASE migrated TEMPLATE template0" "$PG dbname=postgres"
          bash tools/db-migrate.sh "$PG dbname=migrated" 2>&1 | tee ci-logs/migrate.log

      - name: 마이그레이션한 데이터베이스에서 05 규칙 테스트
        run: bash tools/db-rule-tests.sh "$PG dbname=migrated" 2>&1 | tee ci-logs/rule-tests.log

      - name: 05 검사 전부(check_erd.py)
        run: python3 -B research/cake-erd-2026-11/check_erd.py . --db "$PG" 2>&1 | tee ci-logs/check-erd.log

      - name: 로그 키 검사
        if: ${{ !cancelled() }}
        run: node tools/check-no-keys.mjs ci-logs/*.log
